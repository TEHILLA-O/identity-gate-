[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "identitygate"
version = "1.0.0"
description = "IdentityGate governance API"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.115.6",
  "uvicorn[standard]==0.34.0",
  "pydantic==2.10.4",
  "pydantic-settings==2.7.1",
  "sqlalchemy==2.0.36",
  "alembic==1.14.0",
  "httpx==0.28.1",
  "psycopg[binary]==3.2.3",
  "PyJWT==2.10.1",
  "cryptography==44.0.0",
  "itsdangerous==2.2.0",
  "reportlab==4.2.5",
  "openpyxl==3.1.5",
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.4",
  "ruff==0.8.4",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = [".", ".."]
testpaths = ["tests"]
markers = ["integration: requires the local docker stack"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
